name: Build Kaze RAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest runner already ships with the Android SDK
      # (ANDROID_HOME), so no separate SDK setup step is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Put your own presplash.png in the repo root to replace the bundled placeholder.
      - name: Use custom presplash.png (if provided)
        run: |
          if [ -f presplash.png ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp presplash.png app/src/main/res/drawable-nodpi/presplash.png
            echo "Using presplash.png from repo root"
          fi

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk   dist/Kaze-RAR-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Kaze-RAR-release.apk
          ls -la dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaze-RAR-debug
          path: dist/Kaze-RAR-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaze-RAR-release
          path: dist/Kaze-RAR-release.apk
          if-no-files-found: error
